<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — ResumeBot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        .login-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
        .login-glow {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            pointer-events: none;
        }
    </style>
</head>
<body class="login-bg h-full flex items-center justify-center p-4 font-sans antialiased overflow-hidden">
    <div class="login-glow bg-blue-500 -top-16 -left-16"></div>
    <div class="login-glow bg-cyan-500 -bottom-16 -right-16"></div>

    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-500 shadow-lg shadow-blue-500/20 mb-2">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <h1 class="text-base font-bold text-white">ResumeBot</h1>
            <p class="text-gray-400 text-xs mt-0.5">自动投递简历系统</p>
        </div>

        <!-- Login card -->
        <div class="glass rounded-xl p-5">
            {% if error %}
            <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/20 text-red-300 px-3 py-2.5 rounded-lg mb-4 text-xs">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/auth/login" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">用户名</label>
                    <input type="text" name="username" required class="input-field text-sm py-1.5" placeholder="请输入用户名">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">密码</label>
                    <input type="password" name="password" required class="input-field text-sm py-1.5" placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary w-full py-2 text-sm font-medium">登 录</button>
            </form>

            <p class="text-center text-gray-600 text-[10px] mt-4">
                默认账号: <span class="text-gray-500">admin / admin123</span>
            </p>
        </div>
    </div>
</body>
</html>
